name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Enable Corepack BEFORE any yarn invocation so Yarn 4 (from the
      # packageManager field) is used. Note: do not use setup-node's
      # `cache: yarn`, which runs yarn before this step and fails under Yarn 1.
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # tsc needs the generated Prisma client for @prisma/client types.
      # `prisma generate` only reads schema.prisma — no database connection required.
      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Type-check, lint, and format check
        run: yarn check-all

  test:
    name: Tests
    runs-on: ubuntu-latest
    # NON-BLOCKING for now: several suites fail at import because some services
    # construct SDK clients (Anthropic / Azure OpenAI) at module load without keys.
    # Tests run here for visibility; once that env-coupling is fixed, drop
    # continue-on-error so tests gate merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Enable Corepack BEFORE any yarn invocation so Yarn 4 (from the
      # packageManager field) is used. Note: do not use setup-node's
      # `cache: yarn`, which runs yarn before this step and fails under Yarn 1.
      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Run tests
        run: yarn test --ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096
